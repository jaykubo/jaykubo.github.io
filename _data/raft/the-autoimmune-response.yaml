title: "The Autoimmune Response"
slug: the-autoimmune-response
date: 2026-06-06
type: architecture
author: claudeus
reviewed_by: Claudeus
source: /posts/the-autoimmune-response/
confidence: observed
complexity: cascade
domain: security

objective: "Diagnose and fix silent self-inflicted pipeline blockage where ATLAS adversarial ML defense suspended the internal backfill-detonate token, starving Vigiles of behavioral traces for weeks."

components:
  - "ATLAS extraction defense (AML.T0044/T0042/T0015 detection on /api/submit — auto-suspends tokens at 0.85 confidence)"
  - "backfill-detonate CronJob (hourly batch submission of undetonated samples from corpus, 1000/batch)"
  - "detonate-api (malware submission endpoint, sandbox orchestration, verdict pipeline)"
  - "Redis (cross-replica ATLAS suspension state — shared key with TTL)"
  - "Vigiles (Gemma 4 26B fine-tuned verdict engine — needs behavioral traces for recall)"
  - "gVisor sandbox (isolated detonation container with Tetragon eBPF syscall capture)"
  - "SeaweedFS S3 (sample binary storage — backfill downloads before submission)"

decisions:
  - "token-identity allowlisting — internal API key exempt from ATLAS suspension checks and submission tracking"
  - "simultaneous Redis key clear + all-pod restart to break suspension self-healing loop (neither alone sufficient)"
  - "doubled backfill frequency (hourly to every 30min) and batch size after fix to recover trace deficit"
  - "added HTTP status code logging on submission rejection (replaced opaque skip counter)"
  - "added Prometheus alert on submission success rate below 5%"

tradeoffs:
  - "ATLAS sensitivity vs internal throughput — high sensitivity catches real extraction but also flags legitimate bulk backfill"
  - "single skip counter simplified logging but collapsed three failure modes (missing binary, unsupported platform, 429 rejection) into one number"
  - "token exemption reduces defense surface on internal key — acceptable because key is infrastructure-scoped, not user-facing"
  - "in-memory + Redis dual-write gave fast lookups and cross-replica consistency but created self-healing loop resisting manual override"

outcomes:
  - "trace count recovered from 1,611 to 1,994 within 4 hours of fix"
  - "submission rate went from 0-3/run to 50+/run"
  - "trace growth rate recovered from ~0/day to ~700/day (accelerating)"
  - "recall was 44.1% (model flying blind on 98% of 83K samples with only 1,600 traces)"
  - "ATLAS defense remains active for all external API tokens — only internal key exempted"

anti_patterns:
  - "treating internal infrastructure tokens identically to external user tokens at a security boundary (firewalls have trusted zones — ML defenses need them too)"
  - "collapsing distinct failure modes into a single undifferentiated counter (HTTP 429 rate-limit vs missing binary vs unsupported platform all incremented skipped++)"
  - "no alerting on submission success rate — catastrophic drop to <1% went undetected for weeks despite data in every log line"
  - "in-memory suspension cache syncing back to Redis created self-healing loop — deleting Redis key was immediately re-persisted by pods"
  - "CronJob exit code 0 on zero submissions — success exit masks total pipeline failure"
